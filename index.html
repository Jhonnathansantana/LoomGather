<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoomGather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>LoomGather</h1>
    </header>

    <main>
        <!-- Login Section -->
        <section id="auth-section">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
            <p id="error-message" class="error"></p>
            <div style="text-align: center; margin-top: 20px;">
                <a href="dashboard.html">Ir al Dashboard (temporal)</a>
            </div>
        </section>

        <!-- Protected Content Section (hidden by default) -->
        <section id="protected-section" class="hidden">
            <h2>Bienvenido, Consultor</h2>
            <p>Aquí irá el dashboard principal de la aplicación.</p>
            <button id="logout-button">Cerrar Sesión</button>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
