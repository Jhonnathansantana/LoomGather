<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levantamiento - LoomGather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="logo">Loombridge</div>
        <a href="dashboard.html" class="button-secondary">Volver al Dashboard</a>
    </header>

    <main class="levantamiento-container">
        <aside class="levantamiento-nav">
            <h2>Cliente B - Auditoría</h2>
            <nav>
                <ul>
                    <li class="active"><a href="#">1. Infraestructura</a></li>
                    <li><a href="#">2. Seguridad</a></li>
                    <li><a href="#">3. Software</a></li>
                    <li><a href="#">4. Datos</a></li>
                    <li><a href="#">5. Resumen</a></li>
                </ul>
            </nav>
        </aside>

        <section class="question-area">
            <div id="contenedor-pregunta">
                <!-- Example of how a question will look -->
                <div class="question">
                    <label for="pregunta1">¿Cuál es el proveedor de servicios en la nube principal?</label>
                    <select id="pregunta1" name="pregunta1">
                        <option value="">Seleccione una opción...</option>
                        <option value="aws">AWS</option>
                        <option value="azure">Azure</option>
                        <option value="gcp">GCP</option>
                        <option value="on-premise">On-premise</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="question">
                    <label for="pregunta2">Describa brevemente la arquitectura de red actual.</label>
                    <textarea id="pregunta2" name="pregunta2" rows="5" placeholder="Escriba aquí..."></textarea>
                </div>
            </div>

            <div class="question-navigation">
                <button class="button-secondary">Anterior</button>
                <button class="button-primary">Siguiente</button>
            </div>
        </section>
    </main>

    <!-- We will add levantamiento-specific logic later -->
    <!-- <script type="module" src="app.js"></script> -->
</body>
</html>
